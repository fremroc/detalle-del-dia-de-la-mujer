<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body style="background:#e0f7fa; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; font-family:Arial; overflow:hidden;">
    <style>
        .escena { width: 300px; height: 200px; position: relative; }
        .sobre { width: 100%; height: 100%; background: #80deea; border-radius: 5px; transition: opacity 0.5s ease 1.5s; z-index: 2; }
        .tapa { position: absolute; top: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-top: 100px solid #00acc1; transform-origin: top; transition: 0.6s; z-index: 3; }
        .carta { position: absolute; top: 10px; left: 10px; width: 280px; background: white; padding: 25px; opacity: 0; transition: 1s ease 0.6s; text-align: center; border-radius: 5px; }
        .animar .tapa { transform: rotateX(180deg); }
        .animar .carta { opacity: 1; transform: translateY(-110px) scale(1.3); z-index: 10; width: 320px; left: -20px; }
        .animar .sobre { opacity: 0; }
    </style>
    <div class="escena" id="T"><div class="sobre"><div class="tapa"></div></div><div class="carta">
        <h2 style="color:#00838f; font-size:1em;">¡FELIZ DÍA DE LA MUJER!</h2>
        <p style="color:#37474f;">"Tía, gracias por tu cariño y consejos siempre presentes. ¡Te quiero mucho!"</p>
        <span>💎✨</span>
    </div></div>
    <script>setTimeout(()=>document.getElementById('T').classList.add('animar'),1000);</script>
</body>
</html>
