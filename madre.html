<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><title>Para Mamá</title></head>
<body style="background:#fff5f7; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; font-family:Georgia; overflow:hidden;">
    <style>
        .escena { perspective: 1000px; width: 300px; height: 200px; position: relative; }
        .sobre { width: 100%; height: 100%; background: #ffb7d5; border-radius: 0 0 10px 10px; transition: opacity 0.5s ease 1.5s; z-index: 2; }
        .tapa { position: absolute; top: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-top: 100px solid #d63384; transform-origin: top; transition: 0.6s; z-index: 3; }
        .carta { position: absolute; top: 10px; left: 10px; width: 280px; background: white; padding: 30px; border-radius: 10px; text-align: center; opacity: 0; transition: 1s ease 0.6s; border: 1px solid #ffb7d5; }
        .animar .tapa { transform: rotateX(180deg); }
        .animar .carta { opacity: 1; transform: translateY(-130px) scale(1.3); z-index: 10; width: 340px; left: -30px; }
        .animar .sobre { opacity: 0; }
    </style>
    <div class="escena" id="M"><div class="sobre"><div class="tapa"></div></div><div class="carta">
        <h2 style="color:#d63384; font-size:1.1em;">¡FELIZ DÍA DE LA MUJER!</h2>
        <p style="color:#555; font-style:italic;">"Mamá, tu valentía me inspira cada día. Gracias por ser una mujer increíble."</p>
        <div style="font-size:35px;">🌸🌹✨</div>
    </div></div>
    <script>setTimeout(()=>document.getElementById('M').classList.add('animar'),1000);</script>
</body>
</html>
