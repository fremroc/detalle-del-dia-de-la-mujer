<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para mi Tía</title>
</head>
<body style="background:#fdfaff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif; overflow:hidden;">
    <style>
        .escena { perspective: 1000px; width: 300px; height: 200px; position: relative; }
        .sobre { width: 100%; height: 100%; background: #d1c4e9; border-radius: 5px; transition: 0.5s ease 1.5s; z-index: 2; }
        .tapa { position: absolute; top: 0; width: 0; height: 0; border-left: 150px solid transparent; border-right: 150px solid transparent; border-top: 100px solid #9575cd; transform-origin: top; transition: 0.6s; z-index: 3; }
        .carta { position: absolute; top: 10px; left: 10px; width: 280px; background: white; padding: 25px; border-radius: 8px; opacity: 0; text-align: center; transition: 1s ease 0.6s; box-sizing: border-box; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        .animar .tapa { transform: rotateX(180deg); }
        .animar .carta { opacity: 1; transform: translateY(-110px) scale(1.2); z-index: 10; width: 320px; left: -20px; }
        .animar .sobre { opacity: 0; pointer-events: none; }
    </style>

    <div class="escena" id="T2">
        <div class="sobre"><div class="tapa"></div></div>
        <div class="carta">
            <h2 style="color:#673ab7; font-size:1.1em; margin-bottom:10px;">¡FELIZ DÍA DE LA MUJER!</h2>
            <p style="color:#444; font-size:1em; line-height:1.4;">"Tía, te envío este detalle para desearte un día lleno de cosas buenas. ¡Te quiero mucho!"</p>
            <div style="font-size:25px; margin-top:10px;">🌹💜✨</div>
        </div>
    </div>

    <script>setTimeout(() => document.getElementById('T2').classList.add('animar'), 1000);</script>
</body>
</html>
