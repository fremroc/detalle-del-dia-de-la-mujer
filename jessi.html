<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para Amiga 2</title>
</head>
<body style="background:#fffde7; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; font-family:sans-serif; overflow:hidden;">
    <style>
        .escena { perspective: 1000px; width: 300px; height: 200px; position: relative; }
        
        .sobre { 
            width: 100%; height: 100%; background: #ffeb3b; 
            box-shadow: 5px 5px 0 #fbc02d; transition: opacity 0.5s ease 1.5s; z-index: 2; 
        }
        
        .tapa { 
            position: absolute; top: 0; width: 0; height: 0; 
            border-left: 150px solid transparent; border-right: 150px solid transparent; 
            border-top: 100px solid #f9a825; transform-origin: top; 
            transition: 0.6s ease; z-index: 3; 
        }
        
        .carta { 
            position: absolute; top: 10px; left: 10px; width: 280px; background: white; 
            padding: 25px; border: 2px dashed #fbc02d; border-radius: 10px; 
            opacity: 0; text-align: center; transition: transform 1s ease-out 0.6s, opacity 0.5s ease-out 0.6s; 
        }

        /* Confeti sutil */
        .confeti {
            position: absolute; width: 8px; height: 8px; opacity: 0;
            animation: caer 2.5s linear forwards; z-index: 15;
        }

        @keyframes caer {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .animar .tapa { transform: rotateX(180deg); }
        .animar .carta { 
            opacity: 1; 
            transform: translateY(-120px) scale(1.3); 
            z-index: 10; 
            width: 320px; 
            left: -20px; 
        }
        .animar .sobre { opacity: 0; pointer-events: none; }
    </style>

    <div class="escena" id="contenedorAmiga2">
        <div class="sobre">
            <div class="tapa"></div>
        </div>
        <div class="carta">
            <h2 style="color:#f57f17; font-size:1.1em; margin-bottom:10px;">¡FELIZ DÍA DE LA MUJER! 🥳</h2>
            <p style="color:#444; font-size:0.95em; line-height:1.5;">
                "¡Para una mujer con una energía increíble! Gracias por ser tan auténtica. ¡Pásala genial!"
            </p>
            <div style="font-size:30px; margin-top:10px;">🎉⭐✨</div>
        </div>
    </div>

    <script>
        function crearConfeti() {
            for(let i=0; i<15; i++) { // Menos cantidad
                const c = document.createElement('div');
                c.className = 'confeti';
                c.style.left = Math.random() * 100 + 'vw';
                c.style.backgroundColor = ['#ff4081','#fbc02d','#00e676','#2979ff'][Math.floor(Math.random()*4)];
                c.style.animationDelay = Math.random() * 1.5 + 's';
                document.body.appendChild(c);
            }
        }

        setTimeout(() => { 
            document.getElementById('contenedorAmiga2').classList.add('animar'); 
            crearConfeti();
        }, 1000);
    </script>
</body>
</html>
