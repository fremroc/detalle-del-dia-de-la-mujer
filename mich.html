<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para Amiga 3</title>
</head>
<body style="background:#f0f8ff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; font-family:'Palatino Linotype', 'Book Antiqua', Palatino, serif; overflow:hidden;">
    <style>
        .escena { perspective: 1000px; width: 300px; height: 200px; position: relative; }
        
        .sobre { 
            width: 100%; height: 100%; background: #b0c4de; border-radius: 5px; 
            transition: opacity 0.5s ease 1.5s; z-index: 2; border: 1px solid #778899;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .tapa { 
            position: absolute; top: 0; width: 0; height: 0; 
            border-left: 150px solid transparent; border-right: 150px solid transparent; 
            border-top: 100px solid #4682b4; transform-origin: top; 
            transition: 0.8s ease; z-index: 3; 
        }
        
        .carta { 
            position: absolute; top: 10px; left: 10px; width: 280px; background: white; 
            color: #2f4f4f; padding: 30px; border-top: 5px solid #1e90ff; 
            border-radius: 8px; opacity: 0; text-align: center; 
            transition: transform 1s ease-out 0.8s, opacity 0.5s ease-out 0.8s, width 0.5s ease 1.2s; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* Estilo para la Flor Azul */
        .flor-azul {
            color: #1e90ff; /* Color Azul */
            font-size: 35px;
            margin-top: 15px;
            display: inline-block;
            text-shadow: 0 0 5px rgba(30, 144, 255, 0.5);
        }

        .animar .tapa { transform: rotateX(180deg); }
        .animar .carta { 
            opacity: 1; 
            transform: translateY(-110px) scale(1.3); 
            z-index: 10; 
            width: 320px; 
            left: -20px; 
        }
        .animar .sobre { opacity: 0; pointer-events: none; }
    </style>

    <div class="escena" id="contenedorAmiga3">
        <div class="sobre">
            <div class="tapa"></div>
        </div>
        <div class="carta">
            <h2 style="font-size:1.1em; color:#1e90ff; margin-bottom:15px; letter-spacing: 1px;">¡FELIZ DÍA DE LA MUJER!</h2>
            <p style="font-size:0.95em; color:#2f4f4f; line-height:1.6; font-style: italic;">
                "Valoro mucho tu fuerza silenciosa y tu autenticidad. Que tengas un día increíble."
            </p>
            <div class="flor-azul">🌸</div> </div>
    </div>

    <script>
        setTimeout(() => { 
            document.getElementById('contenedorAmiga3').classList.add('animar'); 
        }, 1000);
    </script>
</body>
</html>
